
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Registration</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="registration">
            <h2>Register for a School Event</h2>
            <p>Please complete the form below.</p>

            <form id="registrationForm">

                <label for="studentName">Full Name:</label>
                <input type="text" id="studentName"
                       placeholder="Enter your full name" required>

                <label for="studentEmail">Email Address:</label>
                <input type="email" id="studentEmail"
                       placeholder="Enter your email" required>

                <label for="studentEvent">Select Event:</label>
                <select id="studentEvent" required>
                    <option value="">Choose an event</option>
                    <option value="Sports Day">Sports Day</option>
                    <option value="Cultural Day">Cultural Day</option>
                    <option value="Science Exhibition">Science Exhibition</option>
                </select>

                <button type="submit">Submit Registration</button>

            </form>

            <p id="message" role="status"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 School Event Registration</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
